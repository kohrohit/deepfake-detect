[project]
name = "dfd"
version = "0.1.0"
requires-python = ">=3.10"
# Floors are the OLDEST version this code has actually been run against, not a
# guess. The previous floors (numpy>=1.24, opencv>=4.8, pillow>=10.0,
# scikit-learn>=1.3, torch>=2.2) had never been executed by anyone: local ran
# 1.26.4/4.10/11.0/1.5.0/2.4.1 and CI ran 2.2.6/5.0.0/12.3.0/1.7.2/2.14.0.
# An unexercised floor is a compatibility claim with no evidence behind it.
#
# Ceilings are at the next major. They bound what a CONSUMER of this package may
# install; they are NOT the CI drift guard. The drift that broke this branch came
# from a MINOR release (torch 2.6 flipping the torch.load weights_only default),
# which `torch<3` would have allowed straight through. requirements-dev.txt pins
# the CI environment exactly; that is the guard.
#
# Both ends of every range below are tested, but only at the two endpoints, and
# only the upper endpoint runs in CI. Nothing exercises the floors automatically.
dependencies = [
    "numpy>=1.26.4,<3",
    "opencv-python-headless>=4.10,<6",
    "pillow>=11.0,<13",
    "pyyaml>=6.0.3,<7",
    "scikit-learn>=1.5,<2",
    "torch>=2.4.1,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
