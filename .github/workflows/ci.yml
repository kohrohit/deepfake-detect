name: CI
on: [push, pull_request]

jobs:
  gates:
    # Every gate runs twice: once against requirements-dev.txt (the newest
    # versions, which is what CI resolved on its own before anything was
    # pinned) and once against requirements-floor.txt (the oldest versions
    # pyproject.toml claims to support). Until this matrix existed, the lower
    # end of every range was covered only by the coincidence that a developer
    # laptop happened to sit there — a claim that would have gone untested the
    # day that laptop was replaced, with no gate going red to say so.
    name: gates (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      # Both legs always report. A red pinned leg must not cancel the floor
      # leg: it is the pair of results that localises a break to one end of a
      # range, and one leg alone cannot do that.
      fail-fast: false
      matrix:
        deps: [dev, floor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-${{ matrix.deps }}.txt
          pip install -e .
      - name: Record the resolved environment
        # Direct dependencies are pinned in both files; transitive ones still
        # float. This is the only record of what a given run actually ran, and
        # it is what the next environment-drift investigation will want.
        run: pip freeze
      - name: Lint
        # Scoped to exactly what test_ci_gates.py::test_ruff_actually_passes runs and
        # what the task's measured baseline covers. `ruff check .` would also lint
        # tests/, which is not part of that baseline and not cleaned up by this task;
        # linting it here would make CI fail on something the test suite says nothing
        # about — the exact "green locally, red in CI" drift this task exists to end.
        run: ruff check src bench corpora
      - name: Types
        run: mypy --config-file mypy.ini
      - name: Tests
        run: pytest -q --cov=src/dfd --cov-fail-under=85
      - name: Asset registration gate
        run: |
          python -c "
          from dfd.asset_scan import assert_all_assets_registered
          # Weight files are gitignored (see .gitignore) and are NOT present on
          # a checkout of this repo, so a CI run legitimately discovers zero
          # assets every time. allow_empty=True records that as a deliberate,
          # inspected state rather than a silent no-op: assert_all_assets_registered
          # still raises AssetScanEmpty without it (verified — a plain checkout
          # trips that exact error), which would turn this into a permanently
          # red, uninformative gate. If a weight file IS ever committed or
          # restored into the tree, this call still enforces that it is
          # registered in the manifest and commercially cleared.
          assert_all_assets_registered('.', 'assets/manifest.yaml', allow_empty=True)
          print('all assets registered and commercially cleared')
          "
