line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "S", "BLE", "RET", "SIM",
          # Logging format-string arity. Added 2026-11-11 after a call in
          # training/fit_gend.py carried seven placeholders and six arguments:
          # `logging` catches the TypeError itself and prints a traceback to
          # stderr WITHOUT raising, so the run continues, every test passes,
          # and the only symptom is a log line that never appeared. Two rules,
          # both clean across src/bench/corpora/training/tests when added.
          "PLE1205", "PLE1206"]
# E722 bare except, BLE001 blind except, S110 try-except-pass: a swallowed error
# in a fraud detector is a fraud that was approved. Never silence these.
ignore = [
    "S101",  # assert is fine in tests
    # N818: exception names ending without "Error" (GuardViolation, InvalidInput,
    # ResourceLimitExceeded, AssetScanEmpty, DuplicateAssetClaim, NonCommercialAsset)
    # are an established public naming convention across ~125 call sites; renaming
    # is a pure style churn with no safety benefit, unlike E722/BLE/S110 below.
    "N818",
    # N812: `import torch.nn.functional as F` is the universal PyTorch idiom.
    "N812",
]

[lint.per-file-ignores]
"tests/*" = ["S", "N802"]
