# Every dataset and weight file used anywhere in this repo must appear here.
# Fails closed: unregistered == non-commercial. See spec §11.
#
# `files` lists the repo-relative path(s) this id covers. A filename alone is
# not a reliable proxy for a logical id (vendor-named exports collide, e.g.
# every HuggingFace `safetensors` checkpoint is routinely named
# "model.safetensors" regardless of which model it is), so the mapping from
# on-disk path to logical id is declared here rather than inferred from the
# name. npr_weights, sbi_effnetb4_weights and ffpp_effnetb4_weights have no
# `files` entry: none of those weight files exist on this machine yet, and
# guessing a path risks it silently matching the wrong file once one is added
# (see dfd/asset_scan.py). Fill in `files` for each when its weight file is
# actually vendored. fairface_corpus has none for a different reason — it is a
# corpus that lives OUTSIDE the repo, like the capture corpus, and is reached
# by a path argument rather than vendored at all.
assets:
  yunet_face_detector:
    source: "https://github.com/opencv/opencv_zoo — face_detection_yunet_2023mar.onnx"
    license: "MIT"
    commercial_use: true
    evidence_url: "https://github.com/opencv/opencv_zoo/blob/main/LICENSE"
    date_checked: "2026-09-20"
    checked_by: "kohrohit@gmail.com"
    files:
      - "assets/models/face_detection_yunet_2023mar.onnx"
  dima806_vit_weights:
    source: "https://huggingface.co/dima806/deepfake_vs_real_image_detection"
    license: "Apache-2.0"
    commercial_use: true
    evidence_url: "https://huggingface.co/dima806/deepfake_vs_real_image_detection"
    date_checked: "2026-09-20"
    checked_by: "kohrohit@gmail.com"
    files:
      - "assets/models/dima806/model.safetensors"
  npr_weights:
    source: "https://github.com/chuangchuangtan/NPR-DeepfakeDetection"
    license: "research-only — VERIFY before any commercial release (spec §11)"
    commercial_use: false
    evidence_url: "https://github.com/chuangchuangtan/NPR-DeepfakeDetection"
    date_checked: "2026-09-20"
    checked_by: "kohrohit@gmail.com"
  sbi_effnetb4_weights:
    source: "https://github.com/mapooon/SelfBlendedImages"
    # VERIFIED at source 2026-09-22 (was "VERIFY before any commercial
    # release"). The repository states verbatim: "Our code and pretrained
    # model are freely available for research purpose. For commercial use: A
    # license agreement is required." Commercial use therefore needs a signed
    # agreement with the author, not merely attribution.
    # SECOND, INDEPENDENT BAR: the released weights were trained on FF-raw and
    # FF-c23 — FaceForensics++. A model fitted on that data is "derived data"
    # under the FF++ terms, so these weights could not ship commercially even
    # if the author granted a licence. Research benchmark baseline only.
    license: "research-only — author's own terms; commercial use requires a signed licence agreement"
    commercial_use: false
    evidence_url: "https://github.com/mapooon/SelfBlendedImages"
    date_checked: "2026-09-22"
    checked_by: "kohrohit@gmail.com"
  ffpp_effnetb4_weights:
    source: "https://github.com/SCLBD/DeepfakeBench"
    # VERIFIED at source 2026-09-22 (was "VERIFY before any commercial
    # release"). DeepfakeBench is released under CC BY-NC-4.0, and that
    # licence covers the pretrained weights it distributes for each of its 36
    # detectors. NonCommercial is a licence term, not a preference. Its own
    # dataset table also marks FaceForensics++ "Rights Cleared: NO".
    license: "CC BY-NC-4.0 — NonCommercial; weights inherit it"
    commercial_use: false
    evidence_url: "https://github.com/SCLBD/DeepfakeBench"
    date_checked: "2026-09-22"
    checked_by: "kohrohit@gmail.com"
  fairface_corpus:
    source: "https://github.com/joojs/fairface — 97,698 real faces, pre-cropped and aligned to 224x224, with age/gender/race labels. Mirrored as HuggingFaceM4/FairFace (ungated). Sampled from Yahoo's YFCC-100M Flickr set."
    # The only face supply this project has found that is BOTH commercially
    # usable and reachable without an EULA, a PI or an academic address — the
    # three walls docs/EULA-ACCESS.md documents. Self-blending (corpora/sbi.py)
    # consumes only REAL faces, so this is a direct substitute for the capture
    # corpus's 19 usable genuine crops (docs/HANDOFF.md §0).
    license: "CC BY 4.0"
    # ATTRIBUTION IS A LICENCE CONDITION. training/export_fairface.py writes
    # the dataset, licence and URL into every exported session's results.json
    # for that reason. Do not strip it.
    commercial_use: true
    # CAVEAT, recorded rather than glossed: CC BY 4.0 settles the COPYRIGHT
    # question and nothing else. These are photographs of real people who
    # licensed an image, not people who consented to biometric processing of
    # their faces. For a product in the identity-verification space that is a
    # data-protection question (GDPR Art. 9 / India's DPDP Act treat biometric
    # data as sensitive), and it is NOT answered by this licence field. The
    # same question the owner attestations below leave open for the capture
    # corpus is open here too, for different reasons.
    evidence_url: "https://github.com/joojs/fairface"
    date_checked: "2026-09-22"
    checked_by: "kohrohit@gmail.com"
    # No `files` entry: the corpus lives OUTSIDE the repo, like the capture
    # corpus, and training/export_fairface.py takes a path to it.

  # Unlike the research-only entries above, blend_seam_weights DOES declare
  # `files`: this project produces the file itself at a known, fixed path
  # (training/fit_blend.py writes exactly assets/models/blend_seam.npz), so
  # there is no vendor-name collision risk to guess around. The file need
  # not exist on disk yet for this entry to be correct — the asset gate only
  # checks *discovered* paths against the manifest, and this path is not
  # discovered until the fitter actually runs.
  blend_seam_weights:
    source: "Fitted in this repo by training/fit_blend.py from self-blended crops of the project's own capture corpus. No external dataset or generator weight file contributes to it."
    license: "owned — no third-party dataset or model contributed to these coefficients"
    # `owned` covers the third-party question only: no licensed dataset, weight
    # file or encumbered code reaches these coefficients (audited by provenance
    # chain 2026-09-21). It does NOT by itself establish the right to fit and
    # ship a model on the 442-session capture corpus those coefficients are
    # derived from. That rests on the owner's attestations, recorded below and
    # in docs/HANDOFF.md §0. Nobody with legal standing has reviewed it.
    commercial_use: true
    owner_attestation: "2026-09-21: the 442-session capture corpus and the 24 cached Reality Defender results are available with rights. 2026-09-22: this product is not ScoreMe's. Both stated by the project owner; not independently verified, and no legal review has been done on whether captures recorded in a v-CIP context may train a model for an unrelated product."
    evidence_url: "docs/EULA-ACCESS.md"
    date_checked: "2026-09-22"
    checked_by: "kohrohit@gmail.com"
    files:
      - "assets/models/blend_seam.npz"
